/**
 * CRM Sales Pipeline Workflow
 * 
 * This workflow defines the business rules and automation for
 * managing deals through the sales pipeline.
 */

name: "Sales Pipeline Automation"
version: "1.0.0"
description: "Automates deal progression and notifications in the sales pipeline"

# Trigger when a deal is created or updated
triggers:
  - event: "Deal.Created"
  - event: "Deal.Updated"
    conditions:
      - field: "stage"
        changed: true

# Workflow steps
steps:
  # Step 1: Validate deal progression
  - name: "validate_stage_progression"
    type: "validation"
    rules:
      - name: "no_backwards_progression"
        condition: |
          if (previous.stage === 'won' || previous.stage === 'lost') {
            throw new Error('Cannot modify a closed deal');
          }
        
  # Step 2: Send notifications
  - name: "send_notifications"
    type: "action"
    conditions:
      - field: "stage"
        equals: "qualified"
    action: |
      // Notify sales manager when deal reaches qualified stage
      await sendNotification({
        to: "sales-manager@company.com",
        subject: `New qualified deal: ${deal.title}`,
        template: "deal_qualified",
        data: { deal, contact, company }
      });
      
  # Step 3: Update expected close date
  - name: "update_close_date"
    type: "data_transformation"
    conditions:
      - field: "stage"
        equals: "proposal"
    action: |
      // Auto-set expected close date to 30 days from now
      if (!deal.expectedCloseDate) {
        deal.expectedCloseDate = new Date(Date.now() + 30 * 24 * 60 * 60 * 1000);
      }
      
  # Step 4: Archive completed deals
  - name: "archive_completed_deals"
    type: "action"
    conditions:
      - field: "stage"
        in: ["won", "lost"]
    action: |
      // Move deal to archive after 90 days
      await scheduleJob({
        name: "archive_deal",
        delay: "90 days",
        data: { dealId: deal.id }
      });

# Error handling
error_handling:
  - type: "retry"
    max_attempts: 3
    backoff: "exponential"
    
  - type: "alert"
    notify: "admin@company.com"
    on_failure: true
