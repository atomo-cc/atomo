name: Release

# NOTE: auto-trigger on tag push disabled to control Actions cost — run manually from the
# Actions tab (workflow_dispatch) with the tag as input. To re-enable, restore the block below:
#
# on:
#   push:
#     tags:
#       - 'v*'
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, or source ref when publish is false'
        required: true
      publish:
        description: 'Create/reuse a Release and upload its binaries (false only retains build artifacts)'
        type: boolean
        default: true

# Release creation/upload needs contents write; publish=false skips both operations.
permissions:
  contents: write

jobs:
  create-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    steps:
      - name: Describe operation
        env:
          SOURCE_REF: ${{ inputs.tag }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          printf 'Source ref: %s\nPublish: %s\n' "$SOURCE_REF" "$PUBLISH"

      - name: Create or reuse Release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "Release $RELEASE_TAG"

  build-release:
    name: Build Release
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        build: [linux, macos, windows]
        include:
          - build: linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: atomo-cli
            asset_name: atomo-linux-x86_64
          - build: macos
            os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: atomo-cli
            asset_name: atomo-macos-x86_64
          - build: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: atomo-cli.exe
            asset_name: atomo-windows-x86_64.exe

    steps:
      - name: Checkout sources
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          cache: false

      - name: Build CLI
        run: cargo build --release --locked -p atomo_cli --target ${{ matrix.target }}

      - name: Verify CLI version on native runners
        if: matrix.build != 'macos'
        shell: bash
        run: |
          expected=$(node -p "require('./package.json').version")
          actual=$("target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" --version)
          test "$actual" = "atomo $expected"

      - name: Verify macOS architecture
        if: matrix.build == 'macos'
        run: file "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" | grep -F x86_64

      - name: Retain CLI for review
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.build }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload Release Asset
        if: inputs.publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" "${{ matrix.asset_name }}"
          gh release upload "$RELEASE_TAG" "${{ matrix.asset_name }}" --repo "$GITHUB_REPOSITORY" --clobber

