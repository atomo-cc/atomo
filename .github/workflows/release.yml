name: Release

# NOTE: auto-trigger on tag push disabled to control Actions cost — run manually from the
# Actions tab (workflow_dispatch) with the tag as input. To re-enable, restore the block below:
#
# on:
#   push:
#     tags:
#       - 'v*'
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true

# The default GITHUB_TOKEN is read-only on this repo, so actions/create-release@v1 +
# upload-release-asset@v1 fail with "Resource not accessible by integration". Grant
# write access to repository contents (the GitHub Releases API) for this workflow.
permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.tag }}
          release_name: Release ${{ github.event.inputs.tag }}
          draft: false
          prerelease: false

  build-release:
    name: Build Release
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        build: [linux, macos, windows]
        include:
          - build: linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: atomo-cli
            asset_name: atomo-linux-x86_64
          - build: macos
            os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: atomo-cli
            asset_name: atomo-macos-x86_64
          - build: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: atomo-cli.exe
            asset_name: atomo-windows-x86_64.exe

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          cache: false

      - name: Build CLI
        run: cargo build --release -p atomo_cli

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: target/release/${{ matrix.artifact_name }}
          asset_name: ${{ matrix.asset_name }}
          asset_content_type: application/octet-stream

  publish-crates:
    name: Publish to crates.io
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false

      - name: Publish atomo_core
        run: cargo publish -p atomo_core --token ${{ secrets.CARGO_TOKEN }}

      - name: Wait for crates.io
        run: sleep 30

      - name: Publish atomo_schema
        run: cargo publish -p atomo_schema --token ${{ secrets.CARGO_TOKEN }}

      - name: Wait for crates.io
        run: sleep 30

      - name: Publish atomo_wasm_runtime
        run: cargo publish -p atomo_wasm_runtime --token ${{ secrets.CARGO_TOKEN }}

      - name: Wait for crates.io
        run: sleep 30

      - name: Publish atomo_projectors
        run: cargo publish -p atomo_projectors --token ${{ secrets.CARGO_TOKEN }}

      - name: Wait for crates.io
        run: sleep 30

      - name: Publish atomo_server
        run: cargo publish -p atomo_server --token ${{ secrets.CARGO_TOKEN }}

      - name: Wait for crates.io
        run: sleep 30

      - name: Publish atomo_cli
        run: cargo publish -p atomo_cli --token ${{ secrets.CARGO_TOKEN }}
