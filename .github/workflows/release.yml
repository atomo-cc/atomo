name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false

  build-release:
    name: Build Release
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        build: [linux, macos, windows]
        include:
          - build: linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: atomo
            asset_name: atomo-linux-x86_64
          - build: macos
            os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: atomo
            asset_name: atomo-macos-x86_64
          - build: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: atomo.exe
            asset_name: atomo-windows-x86_64.exe

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          cache: false

      - name: Build CLI
        run: cargo build --release -p atomo_cli

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: target/release/${{ matrix.artifact_name }}
          asset_name: ${{ matrix.asset_name }}
          asset_content_type: application/octet-stream

  publish-crates:
    name: Publish to crates.io
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false

      - name: Publish atomo_core
        run: cargo publish -p atomo_core --token ${{ secrets.CARGO_TOKEN }}

      - name: Wait for crates.io
        run: sleep 30

      - name: Publish atomo_schema
        run: cargo publish -p atomo_schema --token ${{ secrets.CARGO_TOKEN }}

      - name: Wait for crates.io
        run: sleep 30

      - name: Publish atomo_wasm_runtime
        run: cargo publish -p atomo_wasm_runtime --token ${{ secrets.CARGO_TOKEN }}

      - name: Wait for crates.io
        run: sleep 30

      - name: Publish atomo_projectors
        run: cargo publish -p atomo_projectors --token ${{ secrets.CARGO_TOKEN }}

      - name: Wait for crates.io
        run: sleep 30

      - name: Publish atomo_server
        run: cargo publish -p atomo_server --token ${{ secrets.CARGO_TOKEN }}

      - name: Wait for crates.io
        run: sleep 30

      - name: Publish atomo_cli
        run: cargo publish -p atomo_cli --token ${{ secrets.CARGO_TOKEN }}
