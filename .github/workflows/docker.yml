name: Publish server image

# Builds the atomo-server image and pushes it to GHCR. Manual-dispatch only to
# control Actions cost (matches release.yml); the image build compiles the whole
# server, so we don't run it on every push. Re-enable tag auto-publish by
# uncommenting the `push: tags` block.
#
# on:
#   push:
#     tags: ['v*']
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (e.g. v0.1.0 or latest)'
        required: true
        default: 'latest'

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    name: Build & push atomo-server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Stamp build time
        id: stamp
        run: echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Owner is lowercased for GHCR; image lives at ghcr.io/atomo-cc/atomo-server.
          tags: ghcr.io/atomo-cc/atomo-server:${{ github.event.inputs.tag }}
          # Stamp the image so GET /version reports the exact build (consumer ask).
          build-args: |
            ATOMO_VERSION=${{ github.event.inputs.tag }}
            ATOMO_GIT_SHA=${{ github.sha }}
            ATOMO_BUILD_TIME=${{ steps.stamp.outputs.time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
