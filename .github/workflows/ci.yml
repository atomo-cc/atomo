name: CI

# NOTE: auto-triggers temporarily disabled to control Actions cost.
# Run manually from the Actions tab (workflow_dispatch). To re-enable, restore the block below:
#
# on:
#   push:
#     branches: [ main, develop ]
#   pull_request:
#     branches: [ main ]
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atomo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/atomo_test
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5
        
      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false
          
      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          
      - name: Run cargo test
        run: cargo test --workspace

      # CRM Conformance Suite + other DB-gated integration tests. Serial (--test-threads=1)
      # because they share the atomo_test database. This is the release gate: it drives the
      # real services/crm-service/schema.ts through the platform (schema→codegen→CRUD→RBAC→
      # subscriptions→workflows→projections→events→cache→multi-tenant). See
      # docs/guide/advanced/crm-conformance-plan.md. pgvector is available (pgvector/pgvector
      # image) so the AI/pgvector path (D2) can be exercised here even though it can't locally.
      - name: Run DB-gated conformance + integration tests
        run: cargo test --workspace -- --ignored --test-threads=1
        
  lint:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5
        
      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false
          components: rustfmt, clippy
          
      - name: Run cargo fmt
        run: cargo fmt --all -- --check
        
      - name: Run cargo clippy
        run: cargo clippy --workspace -- -D warnings
        
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5
        
      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false
          
      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          
      - name: Build workspace
        run: cargo build --workspace --release
        
      - name: Upload CLI binary (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: atomo-cli-linux
          path: target/release/atomo-cli
          
      - name: Upload CLI binary (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: atomo-cli-windows
          path: target/release/atomo-cli.exe
          
      - name: Upload CLI binary (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: atomo-cli-macos
          path: target/release/atomo-cli
