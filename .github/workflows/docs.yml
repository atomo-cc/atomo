name: Deploy Documentation

# NOTE: auto-trigger on push temporarily disabled to control Actions cost.
# Run manually from the Actions tab (workflow_dispatch). To re-enable, restore the push block below:
#
# on:
#   push:
#     branches: [ main ]
#     paths:
#       - 'docs/**'
#       - 'README.md'
#       - 'ROADMAP.md'
#       - 'Atomo-*.md'
#   workflow_dispatch:
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 18
          cache: 'pnpm'
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-docs-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies
        run: |
          cd docs
          pnpm install

      - name: Generate API documentation
        run: |
          cargo doc --workspace --no-deps --document-private-items
          mkdir -p docs/.vitepress/dist/api
          cp -r target/doc/* docs/.vitepress/dist/api/ || true

      - name: Build documentation
        run: |
          cd docs
          pnpm build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4