# Netlify configuration for Atomo documentation
[build]
  base = "docs"
  publish = ".vitepress/dist"
  command = "pnpm install && pnpm build"

[build.environment]
  NODE_VERSION = "18"
  PNPM_VERSION = "8"

# Redirect rules for clean URLs
[[redirects]]
  from = "/api/*"
  to = "/api/:splat"
  status = 200

[[redirects]]
  from = "/guide/*"
  to = "/guide/:splat"
  status = 200

[[redirects]]
  from = "/examples/*"
  to = "/examples/:splat"
  status = 200

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for better performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"