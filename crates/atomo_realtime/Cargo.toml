[package]
name = "atomo_realtime"
version = "0.6.4"
edition = "2021"
description = "Atomo Realtime — transport-agnostic ephemeral channels, presence & fan-out (in-memory hub; no HTTP, no event store)"
license = "AGPL-3.0-or-later"

[lib]
name = "atomo_realtime"
path = "src/lib.rs"

[dependencies]
tokio = { workspace = true }
# `rc` enables Serialize for the Arc<RawValue> payload (shared across fan-out).
serde = { workspace = true, features = ["rc"] }
# raw_value lets channel payloads stay opaque: we relay bytes without parsing
# or re-serializing the domain shape (the hub never inspects payloads).
serde_json = { workspace = true, features = ["raw_value"] }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
