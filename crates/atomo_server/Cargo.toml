[package]
name = "atomo_server"
version = "0.1.0"
edition = "2021"
description = "Atomo Server - Web server with GraphQL API using the Atomo library"
license = "AGPL-3.0-or-later"

# Library and binary configuration
[lib]
name = "atomo_server"
path = "src/lib.rs"

[[bin]]
name = "atomo-server"
path = "src/main.rs"

[dependencies]
# Main Atomo library (our new unified API)
atomo = { path = "../atomo" }

# Workspace dependencies
atomo_core = { path = "../atomo_core", features = ["sqlx"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
async-graphql = { workspace = true }
async-graphql-axum = { workspace = true }
prometheus = "0.13"
once_cell = "1.19"

# CLI argument parsing
clap = { version = "4.0", features = ["derive"] }

# Environment variables
dotenvy = "0.15"

# Authentication and security
jsonwebtoken = "9.2"
bcrypt = "0.15"
argon2 = "0.5"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }
async-trait = "0.1"
urlencoding = "2.1"
reqwest = { version = "0.11", features = ["json"] }
atomo_wasm_runtime = { path = "../atomo_wasm_runtime" }
atomo_projectors = { path = "../atomo_projectors" }
toml = "0.8"
wasmtime = "16.0"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tokio = { workspace = true }
serde_json = { workspace = true }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres"] }
atomo_core = { path = "../atomo_core", features = ["sqlx"] }
atomo = { path = "../atomo" }
