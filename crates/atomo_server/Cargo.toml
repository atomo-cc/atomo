[package]
name = "atomo_server"
version = "0.6.4"
edition = "2021"
description = "Atomo Server - Web server with GraphQL API using the Atomo library"
license = "AGPL-3.0-or-later"

# Library and binary configuration
[lib]
name = "atomo_server"
path = "src/lib.rs"

[[bin]]
name = "atomo-server"
path = "src/main.rs"

[dependencies]
# Main Atomo library (our new unified API)
atomo = { path = "../atomo" }

# Workspace dependencies
atomo_core = { path = "../atomo_core", features = ["sqlx"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
axum = { workspace = true, features = ["ws"] }
tower = { workspace = true }
tower-http = { workspace = true }
async-graphql = { workspace = true }
async-graphql-axum = { workspace = true }
prometheus = "0.13"
once_cell = "1.19"

# CLI argument parsing
clap = { version = "4.0", features = ["derive"] }

# Environment variables
dotenvy = "0.15"

# Authentication and security
jsonwebtoken = "9.2"
bcrypt = "0.15"
argon2 = "0.5"
sha2 = "0.10"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }
async-trait = "0.1"
urlencoding = "2.1"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
atomo_projectors = { path = "../atomo_projectors" }
atomo_realtime = { path = "../atomo_realtime" }
serde_yaml = "0.9"
# Optional S3 storage backend (enable with --features storage-s3)
aws-config = { version = "1", optional = true }
aws-sdk-s3 = { version = "1", optional = true }

[features]
storage-s3 = ["dep:aws-config", "dep:aws-sdk-s3"]

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tokio = { workspace = true }
serde_json = { workspace = true }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres"] }
atomo_core = { path = "../atomo_core", features = ["sqlx"] }
atomo = { path = "../atomo" }
